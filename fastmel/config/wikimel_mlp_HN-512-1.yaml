run_name: WikiMEL
seed: 43
pretrained_model: 'openai/clip-vit-base-patch32'
lr: 1e-5

data:
  num_entity: 109976
  kb_img_folder: data/WikiMEL/kb_image
  mention_img_folder: data/WikiMEL/mention_image
  qid2id: data/WikiMEL/qid2id.json
  entity: data/WikiMEL/kb_entity.json
  train_file: data/WikiMEL/WIKIMEL_train_100cands-BM25.json
  dev_file: data/WikiMEL/WIKIMEL_dev_100cands-BM25.json
  test_file: data/WikiMEL/WIKIMEL_test_100cands-BM25.json

  batch_size: 64  
  num_workers: 8
  text_max_length: 40

  eval_chunk_size: 6000
  eval_batch_size: 20
  embed_update_batch_size: 512
  hard_neg_samples: 1
  
model:
  embed_dim: 512                
  pooling_type: 'mlp'  
  reduction: ''
  use_vision: True

trainer:
  accelerator: 'gpu'
  devices: 1
  max_epochs: 30
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 1
  log_every_n_steps: 30
  

score_function: 'cosine'
